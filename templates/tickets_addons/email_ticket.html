<!doctype html>
<html>
  <body style="font-family:Arial,sans-serif">
    <h2>Успешно купен билет</h2>
    <p>Почитувани {{ first_name }} {{ last_name }},</p>
    <p>Вашиот билет за <strong>{{ event_title }}</strong> е успешно купен.</p>
    <ul>
      <li>Име и презиме: {{ first_name }} {{ last_name }}</li>
