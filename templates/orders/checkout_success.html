{% extends "base.html" %}
{% block title %}Checkout • ticketo.mk{% endblock %}
{% block content %}
    <style>
        .checkout-wrap {
            max-width: 560px;
            margin: 2rem 0 3rem 0; /* aligned left, not centered */
        }
        html {

            background-image: url("../../media/images/background.png");
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: cover;
        }

        .checkout-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, .08);
            padding: 24px 24px 28px;
            border: 1px solid rgba(0, 0, 0, .06);
        }

        .checkmark {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #18b66312;
            border: 2px solid #e56340;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }

        .checkmark svg {
            width: 38px;
            height: 38px;
        }

        .success-title {
            font-size: 1.75rem;
            font-weight: 800;
            margin: 0 0 6px;
            color: #111;
        }

        .success-sub {
            color: #6b7280;
            margin: 0 0 18px;
        }

        .success-actions .btn {
            display: inline-block;
            padding: .7rem 1.1rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
        }

        .btn-accent {
            background: #e7712d;
            color: #fff;
            border: 1px solid #e7712d;
        }

        .btn-ghost {
            background: #fff;
            color: #374151;
            border: 1px solid #e5e7eb;
        }
    </style>

    <div class="container">
        <div class="checkout-wrap">
            <div class="checkout-card">
                <div class="checkmark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#18b663" stroke-width="2.5" stroke-linecap="round"
                         stroke-linejoin="round">
                        <path d="M20 6L9 17l-5-5"/>
                    </svg>
                </div>

                <h2 class="success-title">Нарачката е успешна!</h2>
                <p class="success-sub">Ви благодариме за нарачката. Деталите ви се испратени на е-пошта.</p>

                <div class="success-actions">
                    <a href="{% url 'profile' %}" class="btn btn-accent">Препорачани настани</a>
                    <a href="/" class="btn btn-ghost ms-2">Почетна</a>
                </div>

            </div>
        </div>
    </div>
{% endblock %}
